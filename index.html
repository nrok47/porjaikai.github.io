<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Report — พอใจขาย</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <nav class="navmenu">
      <a href="index.html" class="navitem active">รายงาน</a>
      <a href="order.html" class="navitem">สั่งซื้อสินค้า</a>
      <a href="prepare.html" class="navitem">จัดเรียงออเดอร์</a>
      <a href="seller.html" class="navitem">สต็อกสินค้า</a>
    </nav>
    <a class="cta-order" href="order.html">สั่งซื้อสินค้า</a>
    <div id="loadingBanner" class="loading-banner">รอโหลดสักครู่เด้อ</div>
    <main class="container">
      <h1>รายงานรายการสั่งซื้อ</h1>
      <section class="card">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <label>เลือกวันที่: <input type="date" id="filterDate"></label>
          <button id="applyFilter">กรอง</button>
          <button id="todayBtn">วันนี้</button>
        </div>
      </section>
      <div id="summary" class="card">
        <div><strong>ยอดรวมทั้งหมด:</strong> <span id="totalRevenue">0</span> ฿</div>
        <div><strong>ยอดยังไม่ชำระ:</strong> <span id="totalUnpaid">0</span> ฿</div>
      </div>

      <section class="card">
        <h2>รายการสั่งซื้อ</h2>
        <div style="overflow:auto">
          <table id="ordersTable">
            <thead>
              <tr id="ordersHeader">
                <!-- header rebuilt by script -->
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="assets/app.js"></script>
    <script>
      // Clean renderer: sets default date to today, injects product columns,
      // hides the previous "ชำระแล้ว" column and formats date as D/เดือน(ย่อ).
      let sellers = [];

      function formatThaiShort(dateStr){
        if(!dateStr) return '';
        const ymd = (dateStr + '').slice(0,10);
        const parts = ymd.split('-');
        if(parts.length !== 3) return dateStr;
        const d = String(Number(parts[2]));
        const month = Number(parts[1]);
        const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
        return d + '/' + (months[month-1]||parts[1]);
      }

      function showLoading(){ const b = document.getElementById('loadingBanner'); if(b) b.style.display='block'; }
      function hideLoading(){ const b = document.getElementById('loadingBanner'); if(b) b.style.display='none'; }

      async function init(){
        showLoading();
        sellers = await App.listSellers();
        const d = new Date();
        const iso = d.toISOString().slice(0,10);
        document.getElementById('filterDate').value = iso;
        document.getElementById('applyFilter').onclick = async ()=>{ showLoading(); await renderOrders(); hideLoading(); };
        document.getElementById('todayBtn').onclick = async ()=>{ document.getElementById('filterDate').value = iso; showLoading(); await renderOrders(); hideLoading(); };
        await renderOrders();
        hideLoading();
      }

      function sameDate(a,b){ return (a||'').slice(0,10) === (b||'').slice(0,10); }

      async function renderOrders(){
        const filterDate = document.getElementById('filterDate').value || new Date().toISOString().slice(0,10);
        const orders = await App.listOrders();
        const tbody = document.querySelector('#ordersTable tbody');
        tbody.innerHTML = '';

        // Rebuild header
        const headerRow = document.getElementById('ordersHeader');
        headerRow.innerHTML = '';
        headerRow.appendChild(Object.assign(document.createElement('th'),{textContent:'Order ID'}));
        headerRow.appendChild(Object.assign(document.createElement('th'),{textContent:'วันที่'}));
        headerRow.appendChild(Object.assign(document.createElement('th'),{textContent:'ลูกค้า'}));
        sellers.forEach(s=>{ const th = document.createElement('th'); th.textContent = s.name; headerRow.appendChild(th); });
        headerRow.appendChild(Object.assign(document.createElement('th'),{textContent:'รวม'}));
        headerRow.appendChild(Object.assign(document.createElement('th'),{textContent:'สถานะ'}));

        // collect header labels for mobile view (used with CSS td:before content)
        const headers = Array.from(headerRow.children).map(h=>h.textContent);

        // helper to create TD with data-label for responsive layout
        function mkTd(txt, label){ const td = document.createElement('td'); td.textContent = txt; if(label) td.setAttribute('data-label', label); return td; }

        let total=0, unpaid=0;
        orders.forEach(o=>{
          const od = (o.date||'').slice(0,10);
          if(!sameDate(od, filterDate)) return;
          total += Number(o.totalAmount||0);
          const paid = Number(o.paidAmount||0);
          if(!o.paid || paid < (Number(o.totalAmount)||0)) unpaid += (Number(o.totalAmount)||0) - paid;

          const tr = document.createElement('tr');
          tr.appendChild(mkTd(o.orderId, headers[0]));
          tr.appendChild(mkTd(formatThaiShort(o.date), headers[1]));
          tr.appendChild(mkTd(o.customerName, headers[2]));

          const orderItems = o.orders || o['orders (JSON)'] || {};
          sellers.forEach((s, si)=>{
            const qty = orderItems[s.itemId] ? (orderItems[s.itemId].qty || orderItems[s.itemId].quantity || 0) : 0;
            tr.appendChild(mkTd(qty>0 ? qty : '', headers[3 + si]));
          });

          // total and status
          const totalIndex = headers.length - 2;
          const statusIndex = headers.length - 1;
          tr.appendChild(mkTd(o.totalAmount, headers[totalIndex]));
          const statusTd = mkTd('', headers[statusIndex]);
          const isPaid = o.paid && paid >= (Number(o.totalAmount)||0);
          if(isPaid){
            statusTd.textContent = 'จ่ายเงินแล้ว';
          } else {
            statusTd.innerHTML = `<button onclick="showPaymentModal('${o.orderId}')">ยืนยันเงิน</button>`;
          }
          tr.appendChild(statusTd);

          tbody.appendChild(tr);
        });

        document.getElementById('totalRevenue').textContent = total;
        document.getElementById('totalUnpaid').textContent = unpaid;
      }

      // Payment modal
      function showPaymentModal(orderId){
        let modal = document.getElementById('paymentModal');
        if(!modal){
          modal = document.createElement('div');
          modal.id = 'paymentModal';
          modal.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;z-index:9999;';
          modal.innerHTML = `
            <div style="background:#fff;padding:24px 32px;border-radius:12px;min-width:280px;max-width:90vw;box-shadow:0 2px 16px #0002;">
              <h3>เลือกวิธีการชำระเงิน</h3>
              <form id="payForm">
                <label><input type="radio" name="method" value="QR Code" required> QR Code</label><br>
                <label><input type="radio" name="method" value="พร้อมเพย์"> พร้อมเพย์</label><br>
                <label><input type="radio" name="method" value="เงินสด"> เงินสด</label><br>
                <div style="margin-top:16px;text-align:right;">
                  <button type="submit">ยืนยัน</button>
                  <button type="button" onclick="document.getElementById('paymentModal').remove()">ยกเลิก</button>
                </div>
              </form>
            </div>
          `;
          document.body.appendChild(modal);
        }
        modal.querySelector('#payForm').onsubmit = async function(e){
          e.preventDefault();
          const method = modal.querySelector('input[name=method]:checked').value;
          const res = await App.confirmPayment(orderId, method);
          alert((res.message||'เสร็จแล้ว') + '\nวิธี: ' + method);
          modal.remove();
          renderOrders();
        };
      }

      init();
    </script>
  </body>
</html>
