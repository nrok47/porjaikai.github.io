<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stock — ร้านพอใจขาย</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main class="container">
      <h1>สต็อกสินค้า</h1>

      <section class="card">
        <h2>รายการสินค้า</h2>
        <table id="sellerTable">
          <thead>
            <tr><th>Item ID</th><th>ชื่อ</th><th>ราคา</th><th>สต็อก</th><th>การกระทำ</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>เพิ่ม / แก้ไขสินค้า</h2>
        <form id="productForm">
          <label>Item ID <input name="itemId" required></label>
          <label>ชื่อ <input name="name" required></label>
          <label>ราคา <input name="price" type="number" required></label>
          <label>สต็อก <input name="stock" type="number" required></label>
          <button type="submit">บันทึก</button>
        </form>
      </section>
    </main>

    <script src="/assets/app.js"></script>
    <script>
      async function loadSellers(){
        const list = await App.listSellers();
        const tbody = document.querySelector('#sellerTable tbody');
        tbody.innerHTML = '';
        list.forEach(p=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${p.itemId}</td>
            <td>${p.name}</td>
            <td>${p.price}</td>
            <td>${p.stock}</td>
            <td>
              <button onclick="editProduct('${p.itemId}')">แก้ไข</button>
              <button onclick="adjustStock('${p.itemId}', -1)">-1</button>
              <button onclick="adjustStock('${p.itemId}', 1)">+1</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      function editProduct(itemId){
        App.listSellers().then(list=>{
          const p = list.find(x=>x.itemId===itemId);
          if(!p) return alert('ไม่พบสินค้า');
          const f = document.forms['productForm'];
          f.itemId.value = p.itemId;
          f.name.value = p.name;
          f.price.value = p.price;
          f.stock.value = p.stock;
        });
      }

      async function adjustStock(itemId, delta){
        await App.updateStock(itemId, delta);
        loadSellers();
      }

      document.getElementById('productForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const f = e.target;
        const p = {itemId: f.itemId.value, name: f.name.value, price: Number(f.price.value), stock: Number(f.stock.value)};
        const res = await App.saveProduct(p);
        alert(res.message || 'บันทึกเรียบร้อย');
        f.reset();
        loadSellers();
      });

      loadSellers();
    </script>
  </body>
</html>
